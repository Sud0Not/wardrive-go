name: Build APK (with fixes)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply local fixes (CARTO map key, masked API key fields)
        env:
          FIXES: 
        run: echo "$FIXES" | base64 -d | gunzip | git apply -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fixed-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "wardrive-go-$TAG.apk"
          gh release create "$TAG" "wardrive-go-$TAG.apk" --title "Wardrive Go $TAG" --notes "Debug build of ${GITHUB_SHA::7} with local fixes: CARTO map key field, masked API key fields."
