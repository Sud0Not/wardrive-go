name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "wardrive-go-$TAG.apk"
          gh release create "$TAG" "wardrive-go-$TAG.apk" --title "Wardrive Go $TAG" --notes "Debug build of ${GITHUB_SHA::7}"
